name: ASDL Hub CI / Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Verify Go dependencies
        run: go mod tidy

      - name: Verify Go formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run Go tests
        run: go test ./...

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Build Hub
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/asdl-hub-${GOOS}-${GOARCH}" \
            ./cmd/hub

      - name: Package release
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          PACKAGE="asdl-hub-${VERSION}-linux-${{ matrix.goarch }}"

          mkdir -p "release/${PACKAGE}/bin"

          cp "dist/asdl-hub-linux-${{ matrix.goarch }}" \
             "release/${PACKAGE}/bin/asdl-hub"

          cp -r dashboard "release/${PACKAGE}/dashboard"

          rm -rf \
            "release/${PACKAGE}/dashboard/node_modules" \
            "release/${PACKAGE}/dashboard/.next"

          cp go.mod "release/${PACKAGE}/"
          cp go.sum "release/${PACKAGE}/"

          tar -C release \
            -czf "release/${PACKAGE}.tar.gz" \
            "${PACKAGE}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: asdl-hub-linux-${{ matrix.goarch }}
          path: release/*.tar.gz

      - name: Upload install script
        if: matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: install-script
          path: scripts/install.sh

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: asdl-hub-linux-*
          merge-multiple: true

      - name: Download install script
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: install-script
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS
            release/install.sh