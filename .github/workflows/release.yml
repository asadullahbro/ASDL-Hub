name: ASDL Hub CI / Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Verify Go dependencies
        run: go mod tidy

      - name: Verify Go formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run Go tests
        run: go test ./...

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Build Hub
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}" \
            -o "dist/asdl-hub-${GOOS}-${GOARCH}" \
            ./cmd/hub

      - name: Package release
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          PACKAGE="asdl-hub-${VERSION}-linux-${{ matrix.goarch }}"

          mkdir -p "release/${PACKAGE}/bin"

          cp "dist/asdl-hub-linux-${{ matrix.goarch }}" \
             "release/${PACKAGE}/bin/asdl-hub"

          cp -r dashboard "release/${PACKAGE}/dashboard"

          rm -rf \
            "release/${PACKAGE}/dashboard/node_modules" \
            "release/${PACKAGE}/dashboard/.next"

          cp -r static "release/${PACKAGE}/static"

          cp go.mod "release/${PACKAGE}/"
          cp go.sum "release/${PACKAGE}/"

          tar -C release \
            -czf "release/${PACKAGE}.tar.gz" \
            "${PACKAGE}"

          # The command on its own, for the CLI installer (the archive also
          # carries the dashboard and sources).
          cp "dist/asdl-hub-linux-${{ matrix.goarch }}" \
             "release/asdl-hub-linux-${{ matrix.goarch }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: asdl-hub-linux-${{ matrix.goarch }}
          path: |
            release/*.tar.gz
            release/asdl-hub-linux-${{ matrix.goarch }}

      - name: Upload install script
        if: matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: install-script
          path: |
            scripts/install.sh
            scripts/install.ps1

  # The command line (the same program as the Hub) for systems the Hub itself
  # doesn't run on; Linux's plain binaries come from the build job above.
  build-cli:
    name: CLI ${{ matrix.goos }}-${{ matrix.goarch }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""; [ "$GOOS" = windows ] && EXT=".exe"
          mkdir -p cli
          go build -trimpath -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" \
            -o "cli/asdl-hub-${GOOS}-${GOARCH}${EXT}" ./cmd/hub

      - uses: actions/upload-artifact@v4
        with:
          name: asdl-hub-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cli/*

  release:
    name: Publish GitHub Release
    needs: [build, build-cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: asdl-hub-linux-*
          merge-multiple: true


      - name: Download command-line builds
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: asdl-hub-cli-*
          merge-multiple: true

      - name: Download install script
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: install-script
          merge-multiple: true

      - name: Stamp version into install scripts
        run: |
          sed -i "s/^ASDL_VERSION=.*/ASDL_VERSION=${GITHUB_REF_NAME}/" release/install.sh
          sed -i "s/^\$AsdlVersion = .*/\$AsdlVersion = '${GITHUB_REF_NAME}'/" release/install.ps1
          grep -q "ASDL_VERSION=${GITHUB_REF_NAME}" release/install.sh
          grep -q "AsdlVersion = '${GITHUB_REF_NAME}'" release/install.ps1

      - name: Generate checksums
        working-directory: release
        run: sha256sum *.tar.gz asdl-hub-linux-* asdl-hub-darwin-* asdl-hub-windows-* install.sh install.ps1 > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/asdl-hub-linux-*
            release/asdl-hub-darwin-*
            release/asdl-hub-windows-*
            release/SHA256SUMS
            release/install.sh
            release/install.ps1